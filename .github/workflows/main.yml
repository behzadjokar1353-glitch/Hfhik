name: Build Hesabdari Behzad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          for NAME in \
            "hesabdari_behzad_v4_3_9_scenario_reviewed.zip" \
            "hesabdari_behzad_v4_3_9_scenario_reviewed1.zip"
          do
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              -name "$NAME" \
              -print -quit)"

            if [ -n "$ZIP_FILE" ]; then
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found."
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              -name '*.zip' -print
            exit 1
          fi

          echo "Using source ZIP: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/source" \
            -maxdepth 5 -type f -print | head -200

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle.kts" ] || \
               [ -f "$DIR/app/build.gradle" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/source" \
              -maxdepth 7 \
              -type f \
              \( -name settings.gradle.kts \
                 -o -name settings.gradle \) \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project with app module not found."
            echo "Searching for Gradle files:"
            find "$GITHUB_WORKSPACE/source" \
              -maxdepth 7 -type f \
              \( -name '*.gradle' \
                 -o -name '*.gradle.kts' \) -print
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        working-directory: .
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle wrapper not found; installing Gradle 8.9."
            sudo apt-get update
            sudo apt-get install -y unzip
            wget -q \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              -O /tmp/gradle-8.9-bin.zip
            sudo unzip -q /tmp/gradle-8.9-bin.zip -d /opt
            /opt/gradle-8.9/bin/gradle \
              --no-daemon assembleDebug
          fi

      - name: Verify APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated successfully: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Behzad-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
