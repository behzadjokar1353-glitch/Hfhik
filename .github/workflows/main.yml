name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract Android project
        run: |
          if [ ! -f "hesabdari_behzad_v4_buildable_source.zip" ]; then
            echo "ERROR: Project ZIP file not found!"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -o "hesabdari_behzad_v4_buildable_source.zip" -d source

      - name: Find Gradle wrapper
        id: find_project
        shell: bash
        run: |
          GRADLE_WRAPPER="$(find source -type f -name gradlew -print -quit)"

          if [ -z "$GRADLE_WRAPPER" ]; then
            echo "ERROR: gradlew not found in extracted project."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_WRAPPER")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$GRADLE_WRAPPER"

          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: .
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="$(find source -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-behzad-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
