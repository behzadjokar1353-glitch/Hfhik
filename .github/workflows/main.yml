name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP if present
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "hesabdari_behzad_v4_buildable_source.zip" ]; then
            mkdir -p source
            unzip -oq \
              "hesabdari_behzad_v4_buildable_source.zip" \
              -d source
            echo "Project ZIP extracted."
          else
            echo "Project ZIP not found; checking repository files."
          fi

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          for BASE in source .; do
            if [ -d "$BASE" ]; then
              while IFS= read -r FILE; do
                CANDIDATE="${FILE%/app/build.gradle.kts}"

                if [ -f "$CANDIDATE/settings.gradle.kts" ] || \
                   [ -f "$CANDIDATE/settings.gradle" ]; then
                  ROOT="$CANDIDATE"
                  break
                fi
              done < <(
                find "$BASE" \
                  -type f \
                  -path '*/app/build.gradle.kts' \
                  -not -path '*/.git/*' \
                  -print
              )
            fi

            if [ -n "$ROOT" ]; then
              break
            fi
          done

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project not found."
            echo "Expected app/build.gradle.kts and settings.gradle.kts."
            exit 1
          fi

          ROOT="$(realpath "$ROOT")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Align Java and Kotlin JVM targets
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Module Gradle file not found: $FILE"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          marker = "// CI_JVM17_CONFIGURATION"

          if marker not in content:
              content += """

          // CI_JVM17_CONFIGURATION
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          """
              path.write_text(content, encoding="utf-8")
              print("Java/Kotlin JVM targets set to 17.")
          else:
              print("JVM configuration already applied.")
          PY

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated at $APK"
            exit 1
          fi

          echo "APK successfully generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-behzad-debug-apk
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
