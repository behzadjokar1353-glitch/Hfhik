
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check project ZIP
        run: |
          if [ ! -f "hesabdari_behzad_v4_buildable_source.zip" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q "hesabdari_behzad_v4_buildable_source.zip" -d source

      - name: Find Gradle wrapper
        id: gradle
        run: |
          GRADLEW=$(find source -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP."
            echo "Files found in source:"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$GRADLEW"

      - name: Build debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-behzad-debug-apk
          path: ${{ steps.gradle.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
