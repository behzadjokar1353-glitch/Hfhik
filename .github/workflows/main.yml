name: Build Hesabdari Behzad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || {
            sdkmanager --licenses
          }

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify and extract project ZIP
        run: |
          set -euo pipefail

          ZIP_FILE="hesabdari_behzad_v4_buildable_source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found: $ZIP_FILE"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -q -o "$ZIP_FILE" -d source

          echo "Project files:"
          find source -maxdepth 4 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) -print

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find source -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found in ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] \
            && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module not found"
            find "$PROJECT_DIR" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "Using project Gradle wrapper."
          else
            echo "Gradle wrapper not found; using Gradle 8.9."

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              -o /tmp/gradle-8.9-bin.zip

            sudo unzip -q -o /tmp/gradle-8.9-bin.zip -d /opt
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            /opt/gradle-8.9/bin/gradle \
              --no-daemon assembleDebug
          fi

      - name: Verify and prepare APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK_PATH="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK file was not generated"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/apk-output/Hesabdari-Behzad-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-output/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Behzad-APK
          path: apk-output/Hesabdari-Behzad-debug.apk
          if-no-files-found: error
          retention-days: 14
